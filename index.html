<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vampire vs Human</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Pixelify+Sans:wght@400;600&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1710;
        overflow: hidden;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
      }
      #hud {
        position: fixed;
        left: 12px;
        bottom: 12px;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(10, 8, 14, 0.7);
        color: #e8dcdc;
        font: 13px/1.4 monospace;
        pointer-events: none;
      }
      #hud:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
